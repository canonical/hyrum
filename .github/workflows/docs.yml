name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed for sphinx-last-updated-by-git
          persist-credentials: false

      - name: Build HTML
        run: make -C docs html

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build

  checks:
    name: Prose checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Run every check even if an earlier one fails, so a single run reports
      # all the prose problems rather than only the first.
      - name: Check links
        if: success() || failure()
        run: make -C docs linkcheck

      - name: Check spelling
        if: success() || failure()
        run: make -C docs spelling

      - name: Check style guide compliance
        if: success() || failure()
        run: make -C docs vale

      - name: Check inclusive language
        if: success() || failure()
        run: make -C docs woke

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # deploy the built site to GitHub Pages
      id-token: write    # OIDC token for actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
