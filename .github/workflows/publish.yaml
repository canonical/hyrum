name: publish

# Publishing a GitHub release is what puts the package on PyPI.
# publish-test-pypi.yaml does the same for Test PyPI, by hand.
#
# `published` rather than `released`, so pre-releases publish too.

on:
  release:
    types: [published]

permissions: {}

# One publish at a time per release. Two runs would build the same thing and
# race each other to the index.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    environment:
      name: publish-pypi
      url: https://pypi.org/p/hyrum
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit the release's tag points at, named rather than left to
          # whatever the event's default checkout would be.
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      # The draft's tag can be edited before it is published, so check it
      # still names the version that is about to be built.
      - name: Check the tag matches the project version
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os, pathlib, sys, tomllib
          tag = os.environ['TAG']
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if tag != f'v{version}':
              print(f'::error::Tag {tag} does not match pyproject.toml version {version} (expected v{version}).')
              sys.exit(1)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      - run: uv build
      - name: Generate CycloneDX SBOM
        run: |
          uv sync --frozen --no-dev
          uv run --project .github/sbom cyclonedx-py environment .venv \
            --output-format JSON \
            --output-file sbom.cdx.json
      # Two separate attestations: SLSA provenance (how it was built)
      # and CycloneDX SBOM (what's inside). sbom-path can't be combined
      # with a provenance attestation, so the SBOM needs its own call.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: 'dist/*'
          sbom-path: sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
