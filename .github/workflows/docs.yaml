name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Prose checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # Run every check even if an earlier one fails, so a single run reports
      # all the prose problems rather than only the first.
      - name: Check links
        if: success() || failure()
        run: make -C docs linkcheck

      - name: Check spelling
        if: success() || failure()
        run: make -C docs spelling

      - name: Check style guide compliance
        if: success() || failure()
        run: make -C docs vale

      - name: Check inclusive language
        if: success() || failure()
        run: make -C docs woke
